<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BINGO PLANET +</title>
<style>
  :root{
    --neon-blue:#00d5ff;
    --neon-cyan:#33ffff;
    --deep-blue:#020218;
    --panel-blue:#061040;
    --grid-blue:#0a1a66;
    --neon-purple:#7a2bff;
    --neon-green:#39ff6a;
    --neon-red:#ff3b30;
    --neon-yellow:#ffd60a;
  }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--deep-blue);
    font-family:"Orbitron","Courier New",monospace;color:var(--neon-cyan);}

  #app{display:flex;width:100%;height:100%;}

  /* ---------- 左側 3D 轉盤 ---------- */
  #wheelPane{position:relative;flex:0 0 45%;min-width:200px;background:#000;}
  #wheelCanvas{width:100%;height:100%;display:block;touch-action:none;}
  button{touch-action:manipulation;}
  #wheelHint{position:absolute;left:8px;bottom:6px;font-size:10px;color:#4af;opacity:.7;}
  /* 左上角：倒數計時 + 發球進度 */
  #hud{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:12px;z-index:5;}
  #countdown{font-size:clamp(24px,4vh,40px);font-weight:900;min-width:1.6em;text-align:center;
    color:var(--neon-yellow);text-shadow:0 0 12px #f80,2px 2px 0 #000;font-family:monospace;}
  #ballDots{display:flex;gap:7px;align-items:center;}
  .ballDot{width:clamp(14px,2.4vh,20px);height:clamp(14px,2.4vh,20px);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffffff,#8899bb);
    border:1px solid #aaeeff;opacity:.22;transition:opacity .3s;}
  .ballDot.fired{opacity:1;box-shadow:0 0 10px #ccffff;}

  /* ---------- 分隔拉桿 ---------- */
  .vsplit{flex:0 0 6px;cursor:col-resize;background:linear-gradient(180deg,#123,#28f,#123);}
  .hsplit{flex:0 0 6px;cursor:row-resize;background:linear-gradient(90deg,#123,#28f,#123);}

  /* ---------- 右側 ---------- */
  #rightPane{flex:1 1 auto;display:flex;flex-direction:column;min-width:320px;}
  #playerPane{flex:3 1 0;overflow:hidden;position:relative;
    background:radial-gradient(ellipse at 50% 0%,#0a1450 0%,#03031f 70%);
    border:2px solid #223bd0;display:flex;flex-direction:column;padding:4px 6px;}
  #buttonPane{flex:1 1 0;min-height:90px;background:linear-gradient(180deg,#101028,#05050f);
    border:2px solid #223bd0;display:flex;align-items:center;justify-content:space-around;
    padding:6px;gap:8px;flex-wrap:wrap;}

  /* ---------- 頂部四大獎勵 ---------- */
  #bonusRow{display:flex;justify-content:space-around;align-items:flex-start;padding:2px 0 4px;}
  .bonus{width:23%;text-align:center;}
  .bonus .label{font-size:clamp(8px,1.1vw,13px);letter-spacing:1px;color:var(--neon-cyan);
    text-shadow:0 0 6px var(--neon-blue);margin-bottom:2px;font-style:italic;font-weight:bold;}
  .bonus .ball{position:relative;margin:0 auto;width:min(9vh,72px);height:min(9vh,72px);
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a52ff 0%,#0a1670 55%,#04062a 100%);
    border:2px solid #3355ff;box-shadow:0 0 10px #123bff,inset 0 0 14px #001;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;}
  .bonus .ball.active{border-color:var(--neon-yellow);
    box-shadow:0 0 22px var(--neon-yellow),0 0 40px #f80,inset 0 0 14px #420;
    animation:bonusGlow .5s alternate infinite;}
  @keyframes bonusGlow{from{filter:brightness(1);}to{filter:brightness(1.6);}}
  .bonus .tier{width:80%;border-radius:4px;margin:1px 0;padding:1px 0;
    font-size:clamp(8px,1vw,12px);font-weight:bold;color:#557;background:#050a30;border:1px solid #223;}
  .bonus .tier.lit{color:#fff;background:#a00;border-color:#f66;text-shadow:0 0 6px #ff0;
    animation:bonusGlow .4s alternate infinite;}
  .bonus .icon{font-size:18px;line-height:1;}

  /* ---------- 標題 ---------- */
  #title{text-align:center;font-size:clamp(14px,2.2vw,26px);font-weight:900;font-style:italic;
    letter-spacing:3px;color:#66e0ff;
    text-shadow:0 0 8px #08f,0 0 20px #05f,2px 2px 0 #013;margin:2px 0 4px;}

  /* ---------- 中段：卡片 + 賠率表 ---------- */
  #midArea{flex:1 1 auto;display:flex;gap:6px;min-height:0;}
  #cardCol{flex:0 0 46%;display:flex;flex-direction:column;min-width:0;}
  #oddsCol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;}

  #cardFrame{border:2px solid #2b6cff;border-radius:8px;background:#040830;
    box-shadow:0 0 12px #14f inset,0 0 8px #23f;padding:4px;flex:1 1 auto;
    display:flex;flex-direction:column;min-height:0;}
  #cardTitle{text-align:center;font-size:clamp(9px,1.1vw,13px);color:#9fdcff;
    border:1px solid #2b6cff;border-radius:10px;margin:0 18% 4px;padding:1px 0;
    background:#061055;text-shadow:0 0 4px #0af;}
  #bingoGrid{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);gap:3px;position:relative;min-height:0;}
  .cell{position:relative;border:1px solid #1440c8;border-radius:4px;background:#050c3a;
    display:flex;align-items:center;justify-content:center;overflow:visible;}
  .cell .num{font-size:clamp(12px,2.4vh,24px);font-weight:900;color:var(--neon-cyan);
    text-shadow:0 0 6px var(--neon-blue),0 0 12px #06f;transition:none;position:relative;z-index:2;}
  .cell.cross{background:#0a1655;border-color:#3a6cff;}
  .cell.marked{background:radial-gradient(circle,#0c53d6 0%,#062a90 80%);border-color:#7fd0ff;
    box-shadow:0 0 10px #3af,inset 0 0 8px #6cf;}
  .cell.marked .num{color:#ffffff;text-shadow:0 0 8px #fff,0 0 16px #4af;}
  .cell.plusone{background:radial-gradient(circle,#1f9a2f 0%,#063a10 85%);border-color:#5f6;
    box-shadow:0 0 12px #4f6;}
  .cell.plusone .num{color:#eaffea;text-shadow:0 0 8px #6f6;}
  .cell.lineWin{animation:lineFlash .3s alternate infinite;}
  @keyframes lineFlash{from{filter:brightness(1);}to{filter:brightness(2);}}

  #oddsX{margin:4px 8% 0;text-align:center;border:2px solid #2b6cff;border-radius:12px;
    padding:2px 0;font-size:clamp(11px,1.4vw,16px);font-weight:bold;color:#bfe9ff;
    background:linear-gradient(180deg,#0a1560,#030724);text-shadow:0 0 6px #0af;
    clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%);}

  /* ---------- 賠率表 ---------- */
  #oddsFrame{flex:1 1 auto;border:2px solid #6a1010;border-radius:6px;background:#180404;
    box-shadow:inset 0 0 14px #400;padding:3px 4px;display:flex;flex-direction:column;min-height:0;}
  #oddsHead{display:flex;justify-content:space-around;margin-bottom:2px;}
  #oddsHead div{flex:1;text-align:center;background:#301;color:#f88;border:1px solid #611;
    font-size:clamp(7px,0.9vw,10px);padding:1px 0;border-radius:3px;margin:0 1px;}
  #oddsTable{flex:1 1 auto;display:flex;flex-direction:column-reverse;min-height:0;}
  .oddsRow{flex:1 1 0;display:flex;align-items:center;border-radius:3px;}
  .oddsRow div{flex:1;text-align:center;font-weight:900;
    font-size:clamp(9px,1.5vh,16px);letter-spacing:1px;}
  .oddsRow.cur{animation:rowBreath 1s ease-in-out alternate infinite;}
  .oddsRow.cur div{animation:lvBlink .35s alternate infinite;}
  @keyframes lvBlink{from{filter:brightness(.9);}to{filter:brightness(2.2);text-shadow:0 0 10px currentColor;}}
  @keyframes rowBreath{from{background-color:transparent;}to{background-color:var(--rowbg);}}
  #lineRow{display:flex;gap:3px;margin-top:3px;}
  .lineBox{flex:1;text-align:center;border:1px solid #2b6cff;border-radius:3px;background:#071040;
    color:#8fd6ff;font-size:clamp(7px,0.9vw,10px);padding:2px 0;line-height:1.1;}
  .lineBox.won{background:#c78500;color:#fff;border-color:#ffd60a;
    box-shadow:0 0 12px #fc0;animation:bonusGlow .3s alternate infinite;}

  /* ---------- 底部資訊列 ---------- */
  #infoBar{display:flex;align-items:center;gap:8px;border-top:2px solid #223bd0;
    margin-top:4px;padding-top:3px;font-size:clamp(10px,1.3vw,15px);}
  #meteor{position:relative;width:64px;height:40px;border:2px solid #4a5;border-radius:50%;
    background:radial-gradient(circle at 60% 40%,#031,#010b04);overflow:hidden;flex:0 0 auto;}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#8fc;}
  .meteorFx{position:absolute;width:26px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#bff,#fff);
    animation:meteorMove .5s linear forwards;}
  @keyframes meteorMove{from{transform:translate(70px,-6px) rotate(20deg);opacity:1;}
    to{transform:translate(-30px,30px) rotate(20deg);opacity:0;}}
  #scoreCols{flex:1 1 auto;display:flex;gap:10px;}
  .scorePair{display:flex;flex-direction:column;gap:1px;}
  .scorePair .k{color:#9f9;font-size:.8em;}
  .scorePair .v{color:#dfd;font-weight:bold;text-shadow:0 0 6px #4f4;font-family:monospace;}
  #gameBox{flex:0 0 auto;border:2px solid #86f;border-radius:4px;background:#204;
    padding:2px 8px;text-align:center;color:#fdb;}
  #gameBox .k{font-size:.7em;color:#faf;}

  /* ---------- 狀態訊息 ---------- */
  #msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    font-size:clamp(14px,2vw,24px);font-weight:900;color:#ffd60a;
    text-shadow:0 0 12px #f80,2px 2px 0 #000;pointer-events:none;z-index:9;
    text-align:center;transition:opacity .3s;opacity:0;}
  #msg.show{opacity:1;}

  /* ---------- 按鈕面板 ---------- */
  .abcd{width:min(9vh,64px);height:min(9vh,64px);border-radius:50%;
    border:3px solid #2bd; background:radial-gradient(circle at 35% 30%,#1a7ad0,#03306a);
    color:#fff;font-size:clamp(14px,2.5vh,22px);font-weight:900;cursor:pointer;
    box-shadow:0 4px 0 #012,0 0 10px #08f;}
  .abcd:active,.abcd.held{transform:translateY(3px);box-shadow:0 1px 0 #012,0 0 18px #0ff;
    background:radial-gradient(circle at 35% 30%,#3fd0ff,#0a55aa);}
  .abcd:disabled{opacity:.35;cursor:not-allowed;}
  .betBtn{width:min(12vh,88px);height:min(12vh,88px);border-radius:50%;border:4px solid #f66;
    background:radial-gradient(circle at 35% 30%,#ff5040,#7a0a00);color:#fff;
    font-size:clamp(12px,2.2vh,18px);font-weight:900;cursor:pointer;line-height:1.1;
    box-shadow:0 5px 0 #300,0 0 16px #f30;}
  .betBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #300,0 0 26px #ff0;}
  .betBtn:disabled{opacity:.35;cursor:not-allowed;}
  .betBtn.bet10{border-color:#fc6;
    background:radial-gradient(circle at 35% 30%,#ffb340,#7a4a00);
    box-shadow:0 5px 0 #430,0 0 16px #fa0;}
  #creditBtn{padding:8px 12px;border-radius:8px;border:2px solid #4f6;background:#052;
    color:#cfc;font-weight:bold;cursor:pointer;font-size:clamp(10px,1.6vh,14px);}
  #creditBtn:active{background:#0a4;}
  #statusLine{width:100%;text-align:center;font-size:clamp(9px,1.4vh,13px);color:#9cf;
    text-shadow:0 0 4px #05f;order:99;}
  .btnLabel{font-size:9px;color:#9cf;text-align:center;margin-top:2px;}
  .btnWrap{display:flex;flex-direction:column;align-items:center;}

  /* ---------- 手機直向：改為上下分割，轉盤在上、Bingo 畫面在下 ---------- */
  @media (max-aspect-ratio: 1/1){
    #app{flex-direction:column;}
    #wheelPane{flex:0 0 40%;min-width:0;min-height:140px;width:100%;}
    .vsplit{cursor:row-resize;background:linear-gradient(90deg,#123,#28f,#123);}
    #rightPane{min-width:0;width:100%;flex:1 1 0;min-height:0;}
    #playerPane{padding:2px 4px;min-height:0;flex:1 1 0;}
    .bonus .ball{width:min(6.5vh,50px);height:min(6.5vh,50px);}
    /* 按鈕區用自然高度確保完整顯示，玩家介面吃剩餘空間 */
    #buttonPane{min-height:0;flex:0 0 auto;gap:5px;padding:4px 2px 8px;}
    .abcd{width:min(6vh,44px);height:min(6vh,44px);font-size:15px;}
    .betBtn{width:min(7.5vh,56px);height:min(7.5vh,56px);font-size:12px;}
    #creditBtn{padding:6px 8px;font-size:10px;}
    #countdown{font-size:clamp(20px,3.2vh,32px);}
  }
</style>
</head>
<body>
<div id="app">
  <div id="wheelPane">
    <canvas id="wheelCanvas"></canvas>
    <div id="hud">
      <div id="countdown"></div>
      <div id="ballDots">
        <div class="ballDot"></div><div class="ballDot"></div><div class="ballDot"></div>
        <div class="ballDot"></div><div class="ballDot"></div>
      </div>
    </div>
    <div id="wheelHint">滑鼠拖曳旋轉視角 / 滾輪縮放</div>
  </div>
  <div class="vsplit" id="vsplit"></div>
  <div id="rightPane">
    <div id="playerPane">
      <div id="bonusRow">
        <div class="bonus" id="bnPlus">
          <div class="label">PLUS ONE</div>
          <div class="ball"><div class="icon">✦</div><div style="font-size:9px;">+1</div></div>
        </div>
        <div class="bonus" id="bnCorner">
          <div class="label">4CORNER</div>
          <div class="ball">
            <div class="tier" id="corner500">500</div>
            <div class="tier" id="corner200">200</div>
          </div>
        </div>
        <div class="bonus" id="bnBonus">
          <div class="label">BONUS GAME</div>
          <div class="ball">
            <div class="tier" id="bonusYellow">YELLOW</div>
            <div class="tier" id="bonusRed">RED</div>
          </div>
        </div>
        <div class="bonus" id="bnOdds">
          <div class="label">ODDS UP</div>
          <div class="ball">
            <div class="tier" id="odds2up">2UP</div>
            <div class="tier" id="odds1up">1UP</div>
          </div>
        </div>
      </div>
      <div id="title">BINGO PLANET +</div>
      <div id="midArea">
        <div id="cardCol">
          <div id="cardFrame">
            <div id="cardTitle">BINGO CARD</div>
            <div id="bingoGrid"></div>
          </div>
          <div id="oddsX">ODDS X1</div>
        </div>
        <div id="oddsCol">
          <div id="oddsFrame">
            <div id="oddsHead"><div>3 LINE</div><div>4 LINE</div><div>5 LINE</div></div>
            <div id="oddsTable"></div>
            <div id="lineRow">
              <div class="lineBox" id="line3">3 IN<br>LINE</div>
              <div class="lineBox" id="line4">4 IN<br>LINE</div>
              <div class="lineBox" id="line5">5 IN<br>LINE</div>
            </div>
          </div>
        </div>
      </div>
      <div id="infoBar">
        <div id="meteor"></div>
        <div id="scoreCols">
          <div class="scorePair"><span class="k">WIN</span><span class="v" id="vWin">0</span></div>
          <div class="scorePair"><span class="k">PAID</span><span class="v" id="vPaid">0</span></div>
          <div class="scorePair"><span class="k">BET</span><span class="v" id="vBet">0</span></div>
          <div class="scorePair"><span class="k">CREDITS</span><span class="v" id="vCredits">1000</span></div>
        </div>
        <div id="gameBox"><div class="k">GAME</div><div id="vGame">1</div></div>
      </div>
      <div id="msg"></div>
    </div>
    <div class="hsplit" id="hsplit"></div>
    <div id="buttonPane">
      <div id="statusLine">開局倒數 30 秒內可下注（BET 可長按連押）與旋轉 A~D。</div>
      <div class="btnWrap"><button class="abcd" id="btnA">A</button><div class="btnLabel">左上</div></div>
      <div class="btnWrap"><button class="abcd" id="btnB">B</button><div class="btnLabel">右上</div></div>
      <div class="btnWrap"><button class="abcd" id="btnC">C</button><div class="btnLabel">左下</div></div>
      <div class="btnWrap"><button class="abcd" id="btnD">D</button><div class="btnLabel">右下</div></div>
      <div class="btnWrap"><button class="betBtn" id="betBtn1">BET<br>1</button><div class="btnLabel">押注 1 (Space)</div></div>
      <div class="btnWrap"><button class="betBtn bet10" id="betBtn10">BET<br>10</button><div class="btnLabel">押注 10 (Enter)</div></div>
      <div class="btnWrap"><button id="creditBtn">CREDITS<br>+1000</button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
/* =====================================================================
 * BINGO PLANET + : SEGA 風格賓果轉盤遊戲
 * 左側：Three.js 3D 物理轉盤（26 洞：中央回收洞 + 1~25 號洞）
 * 右側：賓果卡 / 四大獎勵 / 10 級賠率表 / 積分 / 按鈕面板
 * ===================================================================== */

/* ---------------- 遊戲常數 ---------------- */
const PAYTABLE = [            // 依押注等級 1~10：[3連線, 4連線, 5連線]
  [8,24,64],[16,48,128],[24,72,192],[32,96,256],[64,192,512],
  [128,384,1024],[256,768,2048],[512,1536,4096],[768,2304,6144],[1000,3000,10000]
];
const P_PLUSONE = 1/50, P_CORNER = 1/10, P_BONUS = 1/10, P_ODDSUP = 1/500;
// 升級機率：等級 1~2 為 1/30，等級 3 以上為 1/50
const upgradeChance = lv => lv <= 2 ? 1/30 : 1/50;
const YELLOW_HOLES = new Set([5,10,15,20,25]);
const BALL_INTERVAL = 5000;   // 前三球每 5 秒發射一顆
const RESET_DELAY   = 10000;  // 結算後 10 秒重新開局

/* ---------------- 遊戲狀態 ---------------- */
const S = {
  credits: 1000, paid: 0, win: 0, bet: 0, game: 1,
  level: 1,                 // 押注等級 1~10
  oddsUpStage: 0,           // 0 / 1(1UP) / 2(2UP)
  cornerStage: 0,           // 0 / 1(200) / 2(500)
  bonusStage: 0,            // 0 / 1(紅洞) / 2(黃洞亦可)
  plusOneCount: 0,
  bettingOpen: false,       // 只在開局 30 秒倒數期間可下注
  rotateFree: true,         // 開局到第三球入洞後 5 秒內可自由旋轉 A~D
  paidSpinPhase: false,     // 第四球飛行中：付費購買旋轉機會
  spinTokens: 0,            // 已購買的旋轉機會數
  freeGame: false,          // 本局為免費局
  nextFree: false, nextFreeLevel: 1, nextFreeBet: 0,
  landedBalls: [],          // 本局落入 1~25 的洞號（依序）
  ball4Hole: 0,             // 第四顆球的洞號（BONUS GAME 判定用）
  phase: "idle",            // idle / balls / spin / scoring / reset
  card: [], cross: new Set(), plusLit: new Set(), rotating: false,
};

/* ---------------- 賓果卡：1~25 隨機、中央十字固定 ---------------- */
// 中央十字（第 3 列與第 3 行）在四區塊旋轉時永遠不動
const CROSS_IDX = [2,7,10,11,12,13,14,17,22];
CROSS_IDX.forEach(i => S.cross.add(i));
(function initCard(){
  const nums = Array.from({length:25},(_,i)=>i+1);
  for(let i = nums.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [nums[i],nums[j]] = [nums[j],nums[i]];
  }
  S.card = nums;
})();

const QUADS = { // 四個 2x2 區塊，順時針順序 [左上,右上,右下,左下]
  A:[0,1,6,5], B:[3,4,9,8], C:[15,16,21,20], D:[18,19,24,23]
};

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const gridEl = $("bingoGrid");
const cellEls = [];
(function buildGrid(){
  for(let i = 0; i < 25; i++){
    const d = document.createElement("div");
    d.className = "cell" + (S.cross.has(i) ? " cross" : "");
    const n = document.createElement("span");
    n.className = "num"; n.textContent = S.card[i];
    d.appendChild(n); gridEl.appendChild(d); cellEls.push(d);
  }
})();

(function buildOddsTable(){
  const t = $("oddsTable");
  // column-reverse：等級 1 在最下、等級 10 在最上（同實機面板）
  const colors = ["#3a3a4a","#39ff6a","#39ff6a","#39ff6a","#39ff6a",
                  "#ff9d33","#ff6a33","#ff4d4d","#ff3333","#ffdf3a"];
  const hexToRgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n>>16&255) + "," + (n>>8&255) + "," + (n&255) + "," + a + ")";
  };
  for(let lv = 0; lv < 10; lv++){
    const r = document.createElement("div");
    r.className = "oddsRow"; r.id = "odds_lv"+(lv+1);
    r.style.color = colors[lv];
    // 目前等級整行呼吸閃爍的底色：使用該行文字顏色再淡一半

function placeBet(){
  if(!S.bettingOpen || S.rotating) return;
  if(S.freeGame) return;               // 免費局不需下注
  if(S.credits <= 0){ setStatus("CREDITS 不足，請按 CREDITS +1000"); return; }
  S.credits--; S.bet++;
  meteorFx();
  // 每次押注獨立擲骰：升級 + 四大獎勵
  if(S.level < 10 && Math.random() < upgradeChance(S.level)) S.level++;
  if(Math.random() < P_PLUSONE) triggerPlusOne();
  if(Math.random() < P_CORNER && S.cornerStage < 2){ S.cornerStage++; showMsg("4CORNER " + (S.cornerStage===2?"500":"200") + " !", 1500); }
  if(Math.random() < P_BONUS && S.bonusStage < 2){ S.bonusStage++; showMsg("BONUS GAME " + (S.bonusStage===2?"YELLOW":"RED") + " !", 1500); }
  if(Math.random() < P_ODDSUP && S.oddsUpStage < 2){
    S.oddsUpStage++;
    S.level = Math.min(10, S.level + 1);
    showMsg("ODDS " + S.oddsUpStage + "UP !", 2000);
  }
  refreshScores(); refreshBonusUI();
}
function triggerPlusOne(){
  // 點亮十字上尚未點亮的一格
  const candidates = CROSS_IDX.filter(i => !S.plusLit.has(i));
  if(!candidates.length) return;
  const pick = candidates[Math.floor(Math.random()*candidates.length)];

}

// 依遊戲階段決定能否旋轉：開局免費期直接轉；第四球飛行中消耗購買的機會、成功率 10%
function tryRotate(q){
  if(S.rotating) return;
  if(S.rotateFree){ rotateQuad(q); return; }
  if(S.paidSpinPhase){
    if(S.spinTokens <= 0){ setStatus("請先按 BET 購買旋轉機會（每次付出對應 credits）"); return; }
    S.spinTokens--;
    if(Math.random() < 0.10){
      rotateQuad(q);
      showMsg("SPIN " + q + " 成功！", 1200);
      setStatus(q + " 旋轉成功！剩 " + S.spinTokens + " 次機會");
    } else {
      setStatus(q + " 旋轉失敗（成功率 10%），剩 " + S.spinTokens + " 次機會");
    }
    return;
  }
  setStatus("現在不能旋轉數字");
}
function rotateQuad(q){
  // 四格數字順時針緩慢移動，一秒完成
  const idx = QUADS[q];                 // [左上,右上,右下,左下]
  if(S.rotating) return;
  S.rotating = true;
  const rects = idx.map(i => cellEls[i].getBoundingClientRect());
  idx.forEach((cellIdx, k) => {
    const next = (k+1) % 4;             // 順時針：左上到右上到右下到左下
    const dx = rects[next].left - rects[k].left;
    const dy = rects[next].top  - rects[k].top;
    // 整個格子（含外框、底色、亮燈狀態）一起平移，不只數字
    const el = cellEls[cellIdx];
    el.style.transition = "transform 1s ease-in-out";
    el.style.transform = "translate(" + dx + "px," + dy + "px)";
    el.style.zIndex = 5;
  });
  setTimeout(()=>{
    // 動畫結束後把數值真正換位並復原位移
    const vals = idx.map(i => S.card[i]);
    idx.forEach((cellIdx, k) => {
      S.card[idx[(k+1)%4]] = vals[k];
    });
    idx.forEach(cellIdx => {
      const el = cellEls[cellIdx];
      el.style.transition = "none"; el.style.transform = "none";
      el.style.zIndex = "";
    });
    S.rotating = false;
    refreshCard();
  }, 1000);
}

/* =====================================================================
 * Three.js 3D 轉盤
 * ===================================================================== */
const DISH_R = 10, DISH_A = 0.045, GRAV = 9.8;
const WHEEL_W = 0.35;      // 轉盤角速度（弧度/秒，順時針）
const dishY = r => DISH_A * r * r;
const HOLE_R = 0.52, BALL_R = HOLE_R * 0.9;   // 球直徑為 1~25 洞直徑的 90%
const REST_DEPTH = 0.62;                       // 球坐進洞內的深度，頂部微露出洞口
const RINGS = [
  {count:10, radius:8.2, start:1},
  {count:10, radius:5.8, start:11},
  {count:5,  radius:3.4, start:21},
];
const holeAngle = (rg, i) => (i / rg.count) * Math.PI * 2 + (rg.start === 11 ? Math.PI/rg.count : 0);

const canvas = $("wheelCanvas");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000005);
scene.fog = new THREE.Fog(0x000010, 40, 90);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
camera.position.set(0, 26, 7);         // 預設由上往下看
camera.lookAt(0,0,0);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0,1,0);
controls.maxPolarAngle = Math.PI/2.05;
controls.minDistance = 8; controls.maxDistance = 60;
controls.enableDamping = true;

// 三盞聚光燈
[[0,-1],[120,-1],[240,-1]].forEach((cfg,i)=>{

  const sp = new THREE.SpotLight([0xffffff,0x88bbff,0xffddaa][i], 1.4, 90, 0.5, 0.4);

const wheel = new THREE.Group();
scene.add(wheel);

// 鍋形盤面（LatheGeometry 旋轉曲面），用 alpha 貼圖把 26 個洞真正挖穿
(function buildDish(){
  const pts = [];
  for(let i = 0; i <= 24; i++){
    const r = DISH_R * i / 24;
    pts.push(new THREE.Vector2(r, dishY(r)));
  }
  pts.push(new THREE.Vector2(DISH_R + 0.6, dishY(DISH_R) + 1.2)); // 外牆
  const geo = new THREE.LatheGeometry(pts, 144);
  // alpha 貼圖：白 = 保留、黑 = 挖洞。u 對應繞盤角度、v 對應 profile 半徑
  const cv = document.createElement("canvas"); cv.width = 2048; cv.height = 512;
  const c2 = cv.getContext("2d");
  c2.fillStyle = "#fff"; c2.fillRect(0, 0, 2048, 512);
  c2.fillStyle = "#000";
  const vOf = r => (r / DISH_R) * (24 / 25);            // 第 25 個 profile 點是外牆
  // 中央回收洞（r < 1.0 全挖空）
  c2.fillRect(0, 512 - vOf(1.0)*512, 2048, vOf(1.0)*512 + 2);
  // 1~25 號洞：LatheGeometry 的頂點角 phi 滿足 x=r*sin(phi), z=r*cos(phi)
  RINGS.forEach(rg=>{
    for(let i = 0; i < rg.count; i++){
      const ang = holeAngle(rg, i);
      let u = ((Math.PI/2 - ang) / (Math.PI*2)) % 1; if(u < 0) u += 1;
      const px = u * 2048;
      const py = 512 - vOf(rg.radius) * 512;
      const ru = (HOLE_R / (Math.PI*2*rg.radius)) * 2048;
      const rv = (HOLE_R / DISH_R) * (24/25) * 512;
      [px - 2048, px, px + 2048].forEach(cx=>{        // 處理 u 方向的環繞
        c2.beginPath();
        c2.ellipse(cx, py, ru, rv, 0, 0, Math.PI*2);
        c2.fill();
      });
    }
  });
  const alphaTex = new THREE.CanvasTexture(cv);
  const mat = new THREE.MeshStandardMaterial({color:0x0a1440, metalness:0.7, roughness:0.35,
    side:THREE.DoubleSide, alphaMap:alphaTex, alphaTest:0.5});
  wheel.add(new THREE.Mesh(geo, mat));
  // 盤面放射狀裝飾線
  const lineMat = new THREE.LineBasicMaterial({color:0x2244aa, transparent:true, opacity:0.5});
  for(let k = 0; k < 12; k++){
    const a = k*Math.PI/6, p = [];
    for(let i = 0; i <= 20; i++){
      const r = DISH_R*i/20;
      p.push(new THREE.Vector3(Math.cos(a)*r, dishY(r)+0.02, Math.sin(a)*r));
    }
    wheel.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), lineMat));
  }
  // 中央回收洞
  const cGeo = new THREE.CylinderGeometry(1.0, 1.0, 1.2, 24);
  const cMat = new THREE.MeshStandardMaterial({color:0x000000, metalness:0.2, roughness:0.9});
  const c = new THREE.Mesh(cGeo, cMat); c.position.y = -0.55; wheel.add(c);
  const ringGeo = new THREE.TorusGeometry(1.05, 0.09, 8, 32);
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({color:0x8844ff, emissive:0x5522cc}));
  ring.rotation.x = Math.PI/2; ring.position.y = 0.05; wheel.add(ring);
})();

// 26 洞：外圈 1~10 / 中圈 11~20 / 內圈 21~25
const holes = [];   // {num,r,ang,yellow,occupied,ringMesh}
function numberPlate(num, color){
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  ctx.font = "bold 84px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 22;
  ctx.fillText(String(num), 64, 70);
  const mat = new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false});
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.7), mat);
  m.rotation.x = -Math.PI/2;   // 平躺於盤面，文字上緣朝盤中心（由外側視角可讀）
  return m;
}
// 回傳一個貼平鍋面的群組：局部 Y 為表面法線、Z 指向盤外側
function surfaceGroup(radius, ang){
  const x = Math.cos(ang)*radius, z = Math.sin(ang)*radius;
  const nrm = new THREE.Vector3(-2*DISH_A*x, 1, -2*DISH_A*z).normalize();
  const rOut = new THREE.Vector3(x, 0, z).normalize();
  rOut.sub(nrm.clone().multiplyScalar(rOut.dot(nrm))).normalize();
  const tan = new THREE.Vector3().crossVectors(nrm, rOut);
  const g = new THREE.Group();
  g.position.set(x, dishY(radius), z);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(tan, nrm, rOut));
  return g;
}
(function buildHoles(){
  RINGS.forEach(rg=>{
    for(let i = 0; i < rg.count; i++){
      const num = rg.start + i;
      const ang = holeAngle(rg, i);
      const yellow = YELLOW_HOLES.has(num);
      // 依鍋面法線建立局部座標系，洞環與編號才會貼平所在位置的盤面斜率
      const g = surfaceGroup(rg.radius, ang);
      wheel.add(g);
      // 洞壁（開口圓筒，頂端開放讓球真正掉進去）+ 洞底
      const cupMat = new THREE.MeshStandardMaterial({color:0x02020a, side:THREE.DoubleSide});
      const cup = new THREE.Mesh(
        new THREE.CylinderGeometry(HOLE_R+0.02, HOLE_R*0.85, 1.0, 20, 1, true), cupMat);
      cup.position.y = -0.48; g.add(cup);
      const bottom = new THREE.Mesh(new THREE.CircleGeometry(HOLE_R*0.85, 20), cupMat);
      bottom.rotation.x = -Math.PI/2; bottom.position.y = -0.97; g.add(bottom);
      // 發光洞環：5/10/15/20/25 黃燈，其餘紅燈
      const col = yellow ? 0xffcc00 : 0xff2222;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(HOLE_R+0.08, 0.09, 8, 28),
        new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:0.9})
      );
      ring.rotation.x = Math.PI/2;
      ring.position.y = 0.03; g.add(ring);
      // 編號牌錨定在自己所在半徑的表面（避免因鍋面曲率沉入盤面）
      const pg = surfaceGroup(rg.radius + HOLE_R + 0.95, ang);
      const plate = numberPlate(num, yellow ? "#ffd60a" : "#ff5555");
      plate.position.y = 0.06;
      pg.add(plate);
      wheel.add(pg);
      holes.push({num, r:rg.radius, ang, yellow, occupied:false, ringMesh:ring, cup});
    }
  });
})();

/* ---------------- 球與物理 ---------------- */
const ballGeo = new THREE.SphereGeometry(BALL_R, 20, 20);
const ballMat = new THREE.MeshStandardMaterial({color:0xf5f5f5, metalness:0.3, roughness:0.25, emissive:0x222222});
const balls = [];  // {mesh,x,z,vx,vz,state:"rolling"|"sinking"|"landed",hole,launchT,ballIndex}

function launchBall(ballIndex){
  const mesh = new THREE.Mesh(ballGeo, ballMat.clone());
  scene.add(mesh);
  const a = Math.random()*Math.PI*2;
  const r0 = DISH_R - 0.7;
  const x = Math.cos(a)*r0, z = Math.sin(a)*r0;
  // 發射方向 = 轉盤表面切線方向（順著盤轉，往最外圈洞滾去）
  const speed = 8.5 + Math.random()*1.5;
  const tx = -Math.sin(a), tz = Math.cos(a);      // 切線
  const dir = wheelSurfaceVel(x,z);               // 與盤面同向
  const dot = dir.x*tx + dir.z*tz;
  const sgn = dot >= 0 ? 1 : -1;
  const b = {mesh, x, z, vx:tx*speed*sgn, vz:tz*speed*sgn, state:"rolling", hole:null,
             launchT:performance.now(), ballIndex};
  balls.push(b);
  return b;
}
function wheelSurfaceVel(x,z){
  // 轉盤繞 Y 軸以 rotation.y 遞減旋轉，盤面材質點的世界角速度為 +WHEEL_W
  // （世界角 = 本地角 - rotation.y），故表面速度 = WHEEL_W * (-z, x)
  return {x: -WHEEL_W*z, z: WHEEL_W*x};
}
function holeWorldPos(h){
  // three.js 繞 Y 旋轉 θ：世界角 = 本地角 - θ（rotation.y 遞減 → 世界角遞增 → 俯視順時針）
  const wa = h.ang - wheel.rotation.y;
  return {x: Math.cos(wa)*h.r, z: Math.sin(wa)*h.r, y: dishY(h.r)};
}

function stepBall(b, dt, now){
  if(b.state !== "rolling") return;
  let {x,z,vx,vz} = b;
  const r = Math.max(Math.hypot(x,z), 1e-4);
  // 鍋面坡度重力（往中心）
  const slope = 2 * DISH_A * r * GRAV;
  let ax = -slope * x / r, az = -slope * z / r;
  // 盤面摩擦拖曳：把球速度拉向盤面速度
  const sv = wheelSurfaceVel(x,z);
  const FR = 0.9;
  ax += (sv.x - vx) * FR; az += (sv.z - vz) * FR;
  vx += ax*dt; vz += az*dt;
  x += vx*dt; z += vz*dt;
  // 外牆反彈
  const nr = Math.hypot(x,z);
  if(nr > DISH_R - 0.4){
    const nx = x/nr, nz = z/nr;
    const vdotn = vx*nx + vz*nz;
    if(vdotn > 0){ vx -= 1.6*vdotn*nx; vz -= 1.6*vdotn*nz; }
    const k = (DISH_R-0.4)/nr; x *= k; z *= k;
  }
  // 中央回收洞：補發球
  if(nr < 1.0){
    b.state = "recycling";
    setStatus("球落入回收洞，補發一球");
    setTimeout(()=>{ removeBall(b); relaunch(b.ballIndex); }, 900);
    b.x=x; b.z=z; return;
  }
  // 洞判定：洞緣物理碰撞 + 慢速翻入洞內
  for(const h of holes){
    const hp = holeWorldPos(h);
    const d = Math.hypot(x-hp.x, z-hp.z);
    if(h.occupied){
      // 洞內已有球（頂部露出洞口）：做圓對圓碰撞反彈
      const lim = BALL_R * 1.8;
      if(d < lim && d > 1e-4){
        const nx = (x-hp.x)/d, nz = (z-hp.z)/d;
        const vn = vx*nx + vz*nz;
        if(vn < 0){ vx -= 1.7*vn*nx; vz -= 1.7*vn*nz; }
        x = hp.x + nx*lim; z = hp.z + nz*lim;
      }
      continue;
    }
    const relVx = vx - sv.x, relVz = vz - sv.z;
    const relV = Math.hypot(relVx, relVz);
    if(d < HOLE_R*0.9 && relV < 5.0){
      // 球心越過洞緣且來不及飛越洞口：翻入洞內（進入落下物理）
      startCapture(b, h, now, x, z, vx, vz);
      return;
    }
    if(d < HOLE_R && relV >= 5.0){
      // 高速輾過洞口：撞擊洞緣反彈並損失能量，撞幾次自然變慢入洞
      const nx = (x-hp.x)/Math.max(d,1e-4), nz = (z-hp.z)/Math.max(d,1e-4);
      const vn = relVx*nx + relVz*nz;
      if(vn < 0){
        vx -= 1.55*vn*nx; vz -= 1.55*vn*nz;
        vx = sv.x + (vx - sv.x)*0.7; vz = sv.z + (vz - sv.z)*0.7;
      }
    } else if(d < HOLE_R*2.4 && relV < 4.0){
      // 洞口周圍的漏斗導引：慢速球被導向洞心
      const pull = 10 * (1 - d/(HOLE_R*2.4));
      vx += (hp.x-x)/Math.max(d,1e-4) * pull * dt;
      vz += (hp.z-z)/Math.max(d,1e-4) * pull * dt;
    }
  }
  // 超過 25 秒未入洞：強制落入最近空洞，避免流局
  if(now - b.launchT > 25000){
    let best = null, bd = 1e9;
    for(const h of holes){
      if(h.occupied) continue;
      const hp = holeWorldPos(h);
      const d = Math.hypot(x-hp.x, z-hp.z);
      if(d < bd){ bd = d; best = h; }
    }
    if(best){ startCapture(b, best, now, x, z, vx, vz); return; }
  }
  b.x=x; b.z=z; b.vx=vx; b.vz=vz;
  const y = dishY(Math.hypot(x,z)) + BALL_R;
  b.mesh.position.set(x, y, z);
}
function startCapture(b, h, now, x, z, vx, vz){
  b.state = "capturing"; b.hole = h; h.occupied = true;
  const hp = holeWorldPos(h);
  b.ox = x - hp.x; b.oz = z - hp.z;   // 相對洞心的初始偏移，隨時間收斂到 0
  b.vy = 0; b.py = dishY(Math.hypot(x,z)) + BALL_R;
  b.capT = now;
}
function stepCapture(b, dt, now){
  const h = b.hole, hp = holeWorldPos(h);
  // 水平：0.25 秒內滑進洞心，之後鎖定跟著洞（轉盤）移動 → 球會確實卡在洞內
  const t = Math.min((now - b.capT) / 250, 1);
  b.x = hp.x + b.ox * (1 - t);
  b.z = hp.z + b.oz * (1 - t);
  // 垂直自由落體，落到洞底反彈一下再坐定
  b.vy -= GRAV * dt; b.py += b.vy * dt;
  const restY = dishY(h.r) + BALL_R - REST_DEPTH;
  if(b.py <= restY){
    b.py = restY;
    if(b.vy < -1.2){ b.vy = -b.vy * 0.3; }
    else if(now - b.capT > 350){ b.state = "landed"; onBallLanded(b, h); }
    else b.vy = 0;
  }
  b.mesh.position.set(b.x, b.py, b.z);
  // 保險：入洞流程最多 1.5 秒
  if(b.state === "capturing" && now - b.capT > 1500){ b.state = "landed"; onBallLanded(b, h); }
}
function removeBall(b){
  scene.remove(b.mesh);
  const i = balls.indexOf(b); if(i >= 0) balls.splice(i,1);
}
function relaunch(ballIndex){
  if(S.phase === "balls" || S.phase === "spin") launchBall(ballIndex);
}

/* ---------------- 回合流程 ---------------- */
let launched = 0, timers = [];
function schedule(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function startRound(){
  S.phase = "balls";
  S.landedBalls = []; S.ball4Hole = 0; S.win = 0;
  launched = 0;
  holes.forEach(h => h.occupied = false);
  $("line3").classList.remove("won"); $("line4").classList.remove("won"); $("line5").classList.remove("won");
  cellEls.forEach(e => e.classList.remove("lineWin"));

  if(S.nextFree){
    S.freeGame = true; S.nextFree = false;
    S.level = S.nextFreeLevel; S.bet = S.nextFreeBet;
    showMsg("FREE GAME !<br>等級 " + S.level, 2500);
  } else {
    S.freeGame = false;
    S.bet = 0; S.level = 1;
    S.oddsUpStage = 0; S.cornerStage = 0; S.bonusStage = 0;
  }
  S.plusOneCount = 0; S.plusLit.clear();
  S.bettingOpen = true; S.rotateFree = true;
  S.paidSpinPhase = false; S.spinTokens = 0;
  refreshScores(); refreshBonusUI(); refreshCard();
  updateBallDots();
  // 開局先倒數 30 秒：只有這段時間可以下注，也可自由按 A~D 調整數字位置
  S.phase = "countdown";
  let cd = 30;
  $("countdown").textContent = cd;
  setStatus((S.freeGame ? "免費局（沿用上局等級）" : "倒數 30 秒") + "：可下注、按 A~D 旋轉區塊");
  const cdTimer = setInterval(()=>{
    cd--;
    $("countdown").textContent = cd > 0 ? cd : "";
    if(cd <= 0){
      clearInterval(cdTimer);
      S.bettingOpen = false;         // 開始發球後即不能下注
      S.phase = "balls";
      setStatus("下注截止，開始發球");
      fireNext();                    // 之後前三球每 5 秒發射一顆
    }
  }, 1000);
  timers.push(cdTimer);
}
function updateBallDots(){
  document.querySelectorAll(".ballDot").forEach((d,i)=>d.classList.toggle("fired", i < launched));
}
function fireNext(){
  launched++;
  if(launched > 5) return;
  launchBall(launched);
  updateBallDots();
  if(launched === 4){
    // 第四球飛行中：可付費購買旋轉機會（成功率 10%）
    S.paidSpinPhase = true;
    setStatus("第 4 球飛行中：按 BET 購買旋轉機會，再按 A~D 旋轉（成功率 10%）");
  } else {
    setStatus("第 " + launched + " 球發射");
  }
  if(launched < 3) schedule(fireNext, BALL_INTERVAL);
}
function onBallLanded(b, h){
  S.landedBalls.push(h.num);
  refreshCard();
  const landedCount = S.landedBalls.length;
  if(landedCount === 3){
    // 第三球入洞：倒數 5 秒後鎖定自由旋轉，接著發射第四球
    let rc = 5;
    $("countdown").textContent = rc;
    setStatus("第 3 球入洞：5 秒後鎖定旋轉，把握時間按 A~D");
    const rcTimer = setInterval(()=>{
      rc--;
      $("countdown").textContent = rc > 0 ? rc : "";
      if(rc <= 0){
        clearInterval(rcTimer);
        S.rotateFree = false;
        fireNext();                  // 第 4 球
      }
    }, 1000);
    timers.push(rcTimer);
  } else if(landedCount === 4){
    S.ball4Hole = h.num;
    // 第四球落定：付費旋轉階段結束，發射第五球
    S.paidSpinPhase = false; S.spinTokens = 0;
    schedule(fireNext, 1200);
  } else if(landedCount === 5){
    schedule(scoreRound, 800);
  }
}

/* ---------------- 結算 ---------------- */
const LINES = (function(){
  const L = [];
  for(let r = 0; r < 5; r++) L.push([0,1,2,3,4].map(c => r*5+c));   // 橫排
  for(let c = 0; c < 5; c++) L.push([0,1,2,3,4].map(r => r*5+c));   // 直排
  L.push([0,6,12,18,24]); L.push([4,8,12,16,20]);                    // 對角線
  return L;
})();

function scoreRound(){
  S.phase = "scoring";
  const marked = new Set(S.landedBalls);
  const markedIdx = new Set();
  for(let i = 0; i < 25; i++){
    if(marked.has(S.card[i]) || S.plusLit.has(i)) markedIdx.add(i);
  }
  let total = 0;
  const counts = {3:0,4:0,5:0};
  const pay = PAYTABLE[S.level-1];
  const winCells = new Set();
  if(S.bet > 0 || S.freeGame){
    LINES.forEach(line=>{
      const c = line.filter(i => markedIdx.has(i)).length;
      if(c >= 3){
        counts[c]++;
        total += pay[c-3];
        line.forEach(i => { if(markedIdx.has(i)) winCells.add(i); });
      }
    });
    if(counts[3]) $("line3").classList.add("won");
    if(counts[4]) $("line4").classList.add("won");
    if(counts[5]) $("line5").classList.add("won");
    winCells.forEach(i => cellEls[i].classList.add("lineWin"));
    // 4CORNER：四角全亮
    const corners = [0,4,20,24];
    if(S.cornerStage > 0 && corners.every(i => markedIdx.has(i))){
      const bonus = S.cornerStage === 2 ? 500 : 200;
      total += bonus;
      showMsg("4CORNER +" + bonus + " !", 2500);
    }
    // BONUS GAME：第四球洞色判定，下一局免費（等級沿用）
    if(S.bonusStage > 0 && S.ball4Hole){
      const isYellow = YELLOW_HOLES.has(S.ball4Hole);
      const hit = (S.bonusStage >= 1 && !isYellow) || (S.bonusStage >= 2 && isYellow);
      if(hit){
        S.nextFree = true; S.nextFreeLevel = S.level; S.nextFreeBet = S.bet;
        showMsg("BONUS GAME !<br>下一局免費", 3000);
      }
    }
  }
  S.win = total;
  if(total > 0){
    S.credits += total; S.paid += total;
    showMsg("WIN " + total + " !", 4000);
  } else {
    setStatus("本局未中獎");
  }
  refreshScores();
  setStatus("結算完成，10 秒後開始下一局");
  S.phase = "reset";
  schedule(()=>{
    // 球從洞落下、清場
    balls.slice().forEach(removeBall);
    S.game++;
    hideMsg();
    startRound();
  }, RESET_DELAY);
}

/* ---------------- 輸入事件 ---------------- */
// A~D：依階段旋轉對應的 2x2 區塊（開局免費、第四球飛行中付費 10%）
["A","B","C","D"].forEach(q=>{
  const btn = $("btn"+q);
  const down = e => { e.preventDefault(); btn.classList.add("held"); tryRotate(q); };
  const up = () => btn.classList.remove("held");
  btn.addEventListener("mousedown", down);
  btn.addEventListener("touchstart", down, {passive:false});
  btn.addEventListener("mouseup", up); btn.addEventListener("mouseleave", up);
  btn.addEventListener("touchend", up);
});
function placeBetN(n){
  for(let i = 0; i < n; i++){
    if(!S.bettingOpen || S.credits <= 0) break;
    placeBet();
  }
}
// BET 按鈕：倒數期間下注；第四球飛行中改為購買旋轉機會（每次付出對應 credits）
function betPress(n){
  if(S.bettingOpen){ placeBetN(n); return; }
  if(S.paidSpinPhase){
    const buy = Math.min(n, S.credits);
    if(buy <= 0){ setStatus("CREDITS 不足，無法購買旋轉機會"); return; }
    S.credits -= buy; S.bet += buy; S.spinTokens += buy;
    meteorFx();
    setStatus("旋轉機會 +" + buy + "（共 " + S.spinTokens + " 次，按 A~D 使用，成功率 10%）");
    refreshScores();
    return;
  }
  setStatus("現在不能下注（只能在開局倒數 30 秒內）");
}
function bindBetButton(btn, n){
  let holdTimer = null;
  const down = e => {
    e.preventDefault(); betPress(n);
    holdTimer = setInterval(()=>{ if(S.bettingOpen) placeBetN(n); }, n === 1 ? 80 : 200);
  };
  const up = () => clearInterval(holdTimer);
  btn.addEventListener("mousedown", down);
  btn.addEventListener("touchstart", down, {passive:false});
  ["mouseup","mouseleave","touchend"].forEach(ev => btn.addEventListener(ev, up));
}
bindBetButton($("betBtn1"), 1);
bindBetButton($("betBtn10"), 10);
$("creditBtn").addEventListener("click", ()=>{
  S.credits += 1000; refreshScores();
});
window.addEventListener("keydown", e=>{
  const k = e.key.toUpperCase();
  if(["A","B","C","D"].includes(k) && !e.repeat){
    $("btn"+k).classList.add("held");
    tryRotate(k);
  }
  if(e.code === "Space"){ e.preventDefault(); e.repeat ? placeBetN(1) : betPress(1); }
  if(e.code === "Enter"){ e.preventDefault(); e.repeat ? placeBetN(10) : betPress(10); }
});
window.addEventListener("keyup", e=>{
  const k = e.key.toUpperCase();
  if(["A","B","C","D"].includes(k)) $("btn"+k).classList.remove("held");
});

/* ---------------- 分割拉桿 ---------------- */
(function splitters(){
  const wheelPane = $("wheelPane"), playerPane = $("playerPane"), rightPane = $("rightPane");
  const isPortrait = () => matchMedia("(max-aspect-ratio: 1/1)").matches;
  let dragV = false, dragH = false;
  function onMove(cx, cy){
    if(dragV){
      // 直向時主分割線改為上下拖曳（轉盤在上）
      const pct = isPortrait()
        ? Math.min(70, Math.max(15, cy / innerHeight * 100))
        : Math.min(75, Math.max(20, cx / innerWidth * 100));
      wheelPane.style.flex = "0 0 " + pct + "%";
      resize3D();
    }
    if(dragH){
      const rect = rightPane.getBoundingClientRect();
      const pct = Math.min(90, Math.max(30, (cy - rect.top) / rect.height * 100));
      playerPane.style.flex = "0 0 " + pct + "%";
    }
  }
  const startV = e => { e.preventDefault(); dragV = true; };
  const startH = e => { e.preventDefault(); dragH = true; };
  $("vsplit").addEventListener("mousedown", startV);
  $("hsplit").addEventListener("mousedown", startH);
  $("vsplit").addEventListener("touchstart", startV, {passive:false});
  $("hsplit").addEventListener("touchstart", startH, {passive:false});
  window.addEventListener("mousemove", e => onMove(e.clientX, e.clientY));
  window.addEventListener("touchmove", e => {
    if((dragV || dragH) && e.touches.length){ onMove(e.touches[0].clientX, e.touches[0].clientY); }
  }, {passive:true});
  ["mouseup","touchend","touchcancel"].forEach(ev =>
    window.addEventListener(ev, ()=>{ dragV = dragH = false; }));
  // 直橫向切換時，重設拖曳留下的分割尺寸並重算 3D 畫布
  matchMedia("(max-aspect-ratio: 1/1)").addEventListener("change", ()=>{
    wheelPane.style.flex = "";
    setTimeout(resize3D, 50);
  });
})();

/* ---------------- 渲染主迴圈 ---------------- */
function resize3D(){
  const w = $("wheelPane").clientWidth, h = $("wheelPane").clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h,1);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize3D);
resize3D();

let lastT = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastT)/1000, 0.033);
  lastT = now;
  wheel.rotation.y -= WHEEL_W * dt;      // 由上往下看為順時針
  balls.forEach(b=>{
    if(b.state === "rolling") stepBall(b, dt, now);
    else if(b.state === "capturing") stepCapture(b, dt, now);
    else if(b.state === "landed" && b.hole){
      const hp = holeWorldPos(b.hole);
      b.mesh.position.set(hp.x, hp.y + BALL_R - REST_DEPTH, hp.z);
    }
    else if(b.state === "recycling") b.mesh.position.y -= 3*dt;
  });
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ---------------- 開始遊戲 ---------------- */
refreshScores(); refreshBonusUI(); refreshCard();
startRound();
</script>
